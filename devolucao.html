<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devolução - Video Club Manager</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="monitor"><section class="screen">
<div class="screen-header"><h1>Devolução</h1><a class="text-link" href="index.html">[ Voltar ao menu ]</a></div>
<div id="aviso-devolucao" class="notice"></div>
<form id="form-devolucao">
<div class="grid">
  <div class="form-group full"><label for="devolucao-locacao">Locação em aberto:</label><select id="devolucao-locacao" required></select></div>
  <div class="form-group"><label for="devolucao-data">Data da devolução:</label><input id="devolucao-data" type="date" required></div>
  <div class="form-group"><label for="devolucao-multa">Multa (R$ 2,00 por dia de atraso):</label><input id="devolucao-multa" value="R$ 0,00" readonly></div>
</div>
<div class="actions"><button type="submit">Registrar devolução</button><button type="reset">Cancelar</button></div>
</form>
<h2 style="margin-top:34px">Histórico de devoluções</h2>
<div class="table-wrap"><table>
<thead><tr><th>ID</th><th>Cliente</th><th>Filme</th><th>Locação</th><th>Prevista</th><th>Devolvida</th><th>Multa</th></tr></thead>
<tbody id="tabela-historico"></tbody>
</table></div>
</section></main>
<script src="app.js"></script>
</body></html>
